server {
    listen 80;
    server_name timenookapi.threeminreading.com;
    location ^~ /.well-known/acme-challenge/ {
        root /data/www/certbot;
        default_type text/plain;
    }
    location / { return 308 https://timenookapi.threeminreading.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name timenookapi.threeminreading.com;
    ssl_certificate /data/server/ssl/conf/live/timenookapi.threeminreading.com/fullchain.pem;
    ssl_certificate_key /data/server/ssl/conf/live/timenookapi.threeminreading.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    add_header Cache-Control "no-store" always;
    location = /admin { return 308 /admin/; }
    location = /admin/ { rewrite ^ /admin/index.html last; }
    location /admin/ {
        root /data/server/timenook/current/apps/admin/dist;
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri $uri/ /admin/index.html;
    }
    location = /api { return 308 /api/; }
    location ^~ /api/docs { return 404; }
    location = /api/openapi.json { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:4310/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location / { return 404; }
}
