# Marketing remains at /; the controlled product uses the same HTTPS origin.
server {
    listen 80;
    server_name sgl.wootoon.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /data/www/certbot;
        default_type text/plain;
    }
    location / { return 308 https://sgl.wootoon.cn$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name sgl.wootoon.cn;
    ssl_certificate /data/server/ssl/conf/live/sgl.wootoon.cn/fullchain.pem;
    ssl_certificate_key /data/server/ssl/conf/live/sgl.wootoon.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /data/server/timenook-website/current;
    index index.html;
    client_max_body_size 20m;
    add_header Referrer-Policy "no-referrer" always;
    location = /app { return 308 /app/; }
    location ^~ /app/assets/ {
        root /data/server/timenook-web/current;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /app/ {
        root /data/server/timenook-web/current;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location ^~ /api/v1/admin { return 404; }
    location ^~ /api/docs { return 404; }
    location = /api/openapi.json { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:4310/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location ~ /\. { return 404; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
    }
}
